# 1. Add these lines to the respective sections of your configuration.yaml file for Home Assistant
# 2. Replace using search and replace xxxxxx with your installation number from the iConnect app or the LCD Working status

# =======================

# mtt section

mqtt:
  sensor:
    - name: "xxxxxx OTC Maximum Temperature"
      unique_id: domusa_xxxxxx_otc_maximum_temperature
      state_topic: "domusa/xxxxxx/status"
      value_template: "{{ value_json.max_otc_p08 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-chevron-up
      
  # exterior optional sensor Sonda IC - P153=5
    - name: "xxxxxx OTC Outdoor Temperature"
      unique_id: domusa_xxxxxx_otc_outdoor_temperature
      state_topic: "domusa/xxxxxx/status"
      value_template: "{{ value_json.s_zonaext_c75 }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
    # END exterior optional sensor Sonda IC - P153=5

  binary_sensor:
    - name: "xxxxxx DHW Enabled"
      unique_id: domusa_xxxxxx_dhw_enabled
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.m_acs_p63 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:water-boiler

    - name: "xxxxxx DHW Preparation"
      unique_id: domusa_xxxxxx_dhw_preparation
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.func_hp_2 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:water-boiler

    - name: "xxxxxx Heating Active"
      unique_id: domusa_xxxxxx_heating_active
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.func_hp_1 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      device_class: heat

    - name: "xxxxxx Defrost Active"
      unique_id: domusa_xxxxxx_defrost_active
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.func_hp_4_c33 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:snowflake-melt

    - name: "xxxxxx Backup Source Active"
      unique_id: domusa_xxxxxx_backup_source_active
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.salidas_hp_7_c41 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:fire

    - name: "xxxxxx Compressor Heating Element"
      unique_id: domusa_xxxxxx_Compressor_heating_element
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.salidas_hp_1_c36 | default(false) == true %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:fire

    # Compressor is ON only when actual compressor frequency is above 0 Hz
    # NOTE: unique_id must differ from the add-on's auto-discovered "domusa_xxxxxx_compressor_enabled"
    # (that one is P40 = compressor auto mode), otherwise Home Assistant rejects one of them.
    - name: "xxxxxx Compressor Running"
      unique_id: domusa_xxxxxx_compressor_running_c15
      state_topic: "domusa/xxxxxx/status"
      value_template: >
        {% if value_json.freq_c15 | float(0) > 0 %}ON{% else %}OFF{% endif %}
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:engine

sensor:
  - platform: integration
    source: sensor.solarnet_power_battery_charge
    name: "Total Battery Energy Charged"
    method: left

  - platform: integration
    source: sensor.solarnet_power_battery_discharge
    name: "Total Battery Energy Discharged"
    method: left

  - platform: integration
    source: sensor.solarnet_power_photovoltaics
    name: "Total Photovoltaics Energy"
    method: left

template:
  - sensor:
      - name: "Compressor Demand"
        unique_id: compressor_demand_percent
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {# Set max_hz equal to your P45 (maximum compressor frequency) #}
          {% set max_hz = 85 %}
          {% set hz = states('sensor.xxxxxx_compressor_frequency') | float(0) %}
          {{ [(hz / max_hz * 100), 100] | min | round(1) }}

      - name: "Domusa Delta T"
        unique_id: domusa_delta_t
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.xxxxxx_flow_temperature'))
             and is_number(states('sensor.xxxxxx_return_temperature')) }}
        state: >
          {% set flow = states('sensor.xxxxxx_flow_temperature') | float %}
          {% set return_temp = states('sensor.xxxxxx_return_temperature') | float %}
          {{ (flow - return_temp) | round(1) }}
